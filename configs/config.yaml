server:
  port: 8080
  mode: debug  # debug, release, test
  read_timeout: 60
  write_timeout: 60
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization
    expose_headers:
      - Content-Length
    allow_credentials: true
    max_age: 86400

database:
  driver: postgres
  host: localhost
  port: 5432
  user: postgres
  password: ""
  name: golang_best
  sslmode: disable

log:
  level: info  # debug, info, warn, error
  format: json  # json, console

jwt:
  secret: your-super-secret-key-change-in-production
  expire_time: 24h
